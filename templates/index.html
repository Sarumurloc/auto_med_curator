<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="{{ keywords }}">
    <title>{{ title }}</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 800px; margin: auto; padding: 20px; line-height: 1.6; color: #333; }
        .diagnostic-box { background: #f0f7ff; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .cta-button { display: inline-block; background: #ff9900; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>{{ title }}</h1>
    
    <div class="diagnostic-box">
        <h2>Consultative Analysis: Is this for you?</h2>
        <p><strong>Common Anxiety Trigger:</strong> {{ anxiety_trigger }}</p>
        <p><strong>Recommendation:</strong> {{ recommendation_path }}</p>
        <br>
        <a href="https://www.amazon.com/dp/{{ affiliate_product_id }}/?tag=med-sarumurloc-20" class="cta-button" target="_blank">View Recommended Solution</a>
    </div>

    <div class="article-content">
        <p>For more detailed breakdowns, refer to our comprehensive article...</p>
    </div>
</body>
</html>
